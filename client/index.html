<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-full.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>نظام إدارة مستودعات المطاعم العسكرية</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #0a0f0d;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: 'Cairo', sans-serif;
        }
        .initial-loader img {
          width: 140px;
          height: auto;
          animation: pulse-op 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          filter: drop-shadow(0 0 25px rgba(197, 160, 89, 0.3));
        }
        .initial-loader .text {
          margin-top: 24px;
          color: #c5a059;
          font-size: 16px;
          font-weight: 700;
          letter-spacing: 4px;
          animation: pulse-op 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .spinner-container {
          width: 180px;
          height: 2px;
          background: rgba(197, 160, 89, 0.15);
          margin-top: 20px;
          border-radius: 4px;
          overflow: hidden;
          position: relative;
        }
        .spinner-bar {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 30%;
          background: #c5a059;
          border-radius: 4px;
          animation: loadBar 1.5s ease-in-out infinite;
        }
        @keyframes pulse-op {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.7; transform: scale(0.98); }
        }
        @keyframes loadBar {
          0% { left: -30%; }
          100% { left: 100%; }
        }
      </style>
      <div class="initial-loader">
        <img src="/logo-shield.png" alt="MessOps Logo" />
        <div class="text">M E S S O P S</div>
        <div class="spinner-container">
          <div class="spinner-bar"></div>
        </div>
      </div>
    </div>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ar', includedLanguages: 'ar,en', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
