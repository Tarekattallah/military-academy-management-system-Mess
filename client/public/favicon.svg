<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Shield background (military protection) -->
  <path d="M24 2L44 12V22C44 33.6 35.2 44.4 24 46C12.8 44.4 4 33.6 4 22V12L24 2Z" fill="#1a3a5c"/>
  <!-- Shield border -->
  <path d="M24 4L42 13V22C42 32.8 33.8 42.8 24 44.4C14.2 42.8 6 32.8 6 22V13L24 4Z" fill="#1e4d7a"/>
  <!-- Inner shield -->
  <path d="M24 6L40 14V22C40 31.8 32.4 41 24 42.6C15.6 41 8 31.8 8 22V14L24 6Z" fill="#2563eb"/>
  <!-- Star (military rank) -->
  <polygon points="24,10 26.5,17 34,17 28,21.5 30,29 24,24.5 18,29 20,21.5 14,17 21.5,17" fill="#facc15"/>
  <!-- Warehouse symbol inside shield -->
  <rect x="17" y="26" width="14" height="10" rx="1" fill="#dbeafe" opacity="0.9"/>
  <!-- Roof -->
  <polygon points="24,22 15,27 33,27" fill="#93c5fd" opacity="0.9"/>
  <!-- Door -->
  <rect x="21" y="30" width="6" height="6" rx="0.5" fill="#1e4d7a"/>
  <!-- Crossed swords behind shield (military) -->
  <path d="M8 8L14 14M14 8L8 14" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 8L34 14M34 8L40 14" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Bottom ribbon -->
  <path d="M12 40H36L33 43H15L12 40Z" fill="#1e3a5f"/>
  <path d="M14 40H34L32 42H16L14 40Z" fill="#facc15"/>
  <!-- Small text dots on ribbon -->
  <circle cx="20" cy="41" r="0.8" fill="#1e3a5f"/>
  <circle cx="24" cy="41" r="0.8" fill="#1e3a5f"/>
  <circle cx="28" cy="41" r="0.8" fill="#1e3a5f"/>
</svg>
